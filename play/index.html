<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060916" />
    <meta name="robots" content="noindex" />
    <title>CryptoGram is coming soon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #060916;
        color: #e8ecff;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(100%, 28rem);
        background: #10182e;
        border: 1px solid #1c2744;
        border-top: 3px solid #f5b043;
        border-radius: 14px;
        padding: 1.5rem 1.25rem 1.4rem;
      }
      .kicker {
        margin: 0 0 0.55rem;
        color: #f5b043;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 0.65rem;
        font-family: Georgia, "Liberation Serif", "Times New Roman", serif;
        font-size: 2.5rem;
        line-height: 0.95;
      }
      p {
        margin: 0 0 1.1rem;
        color: #d0d6ec;
        line-height: 1.45;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.85rem;
        padding: 0.45rem 0.95rem;
        border-radius: 10px;
        background: #f5b043;
        color: #1a1205;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #f6e7c1;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Azat</p>
      <h1>CryptoGram</h1>
      <p>The game is coming soon.</p>
      <a href="/">Back to the front page</a>
    </main>
  </body>
</html>
