name: Claude Code

# Event-driven pickup: a comment/issue containing @claude starts a run now.
# This replaces polling Claude on a timer / cloud routine.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # opened only: an Issue created with an assignee fires opened AND assigned with the same
  # @claude body, which would start two runs. Re-ring with a new @claude comment instead.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Stays quiet when the text carries a Route: line or the Issue has a repo:<name> label.
    # Those go to the doorbell router (doorbell-router.yml), which rings the target repo's own doorbell.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, 'Route:') && !contains(join(github.event.issue.labels.*.name, ' '), 'repo:')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && !contains(github.event.issue.body, 'Route:') && !contains(join(github.event.issue.labels.*.name, ' '), 'repo:'))
    runs-on: ubuntu-latest
    # One Claude run per Issue/PR at a time: a second ring queues behind the first instead of
    # running in parallel. Job-level (not workflow-level) so skipped runs, e.g. comments without
    # the mention, never take the slot or replace a queued real run.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history + all remote branches so Claude can resume its own claude/* branches

      - name: Checkout vault (read-only design specs and packets)
        uses: actions/checkout@v6
        with:
          repository: innominatesnap/azattech-grokbots
          token: ${{ secrets.VAULT_READ_TOKEN }}
          path: .vault
          persist-credentials: false

      - name: Keep vault out of commits
        run: echo ".vault/" >> .git/info/exclude

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GrokBots comments are often classified as bot actors. Default is deny-all bots.
          allowed_bots: "*"
          # This job's GitHub token covers this repo only, and the action's default tool
          # allowlist is file tools plus git add/commit/push. Add read-only git and gh so a
          # run can check Issue, PR and run state, and say plainly when work belongs elsewhere
          # instead of trying git ls-remote / gh repo against other repos and being denied.
          # Cross-repo, Supabase and Vercel work goes to the local broker.
          claude_args: |
            --allowedTools "Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git pull:*),Bash(git merge:*),Bash(git rev-parse:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh run view:*),Bash(gh run list:*)"
            --append-system-prompt "A read-only copy of the vault repo innominatesnap/azattech-grokbots (main) is checked out at ./.vault; read design packets and to-claude specs there, never edit or commit it. Scope: this job runs on the azatgames-cryptogram repo only. Its token and tool allowlist cannot reach other repos, Supabase or Vercel. If the work belongs in another repo, do not try git clone, git ls-remote or gh repo. Post one hand-off comment for the local broker (target repo, ordered steps, the status block, Needs from Timothy) and stop. After your final push to a new branch, open the pull request yourself: run gh pr list --head <branch> --state open, and if none is open run gh pr create --base <default branch> --head <branch> --title <latest commit subject> --body <short summary plus Refs #issue>. GH_TOKEN in your shell is already the Claude App token, so CI runs on that PR. Put the PR URL in your status block; do not stop at only a Create PR link. A workflow step after this one flags any pushed branch still left without a PR."
          # Optional: trigger_phrase: "@claude"

      # Safety net (azattech-grokbots#181): the action revokes the Claude App token before this
      # step runs, and a PR opened with GITHUB_TOKEN would not start CI, so this step never opens
      # the PR. If Claude pushed a branch and no PR is open for it, it posts one flag comment.
      - name: Flag a pushed branch that has no PR
        if: always() && steps.claude.outputs.branch_name != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          BASE=$(gh api "repos/$REPO" -q .default_branch)
          AHEAD=$(gh api "repos/$REPO/compare/$BASE...$BRANCH" -q .ahead_by 2>/dev/null)
          if [ -z "$AHEAD" ] || [ "$AHEAD" = "0" ]; then echo "No commits on $BRANCH ahead of $BASE"; exit 0; fi
          OPEN=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -n "$OPEN" ]; then echo "PR already open: $OPEN"; exit 0; fi
          if [ -z "$NUM" ]; then echo "No Issue or PR to comment on"; exit 0; fi
          MARK="<!-- claude-no-pr:$BRANCH -->"
          if gh api "repos/$REPO/issues/$NUM/comments" --paginate -q '.[].body' | grep -qF "$MARK"; then echo "Already flagged"; exit 0; fi
          TITLE=$(gh api "repos/$REPO/commits/$BRANCH" -q '.commit.message' | head -n1)
          Q=$(jq -rn --arg t "$TITLE" --arg b "Opened from Claude's run $RUN_URL. Refs #$NUM" '"title=\($t|@uri)&body=\($b|@uri)"')
          printf '%s\n%s\n' "$MARK" "**No PR yet:** Claude pushed \`$BRANCH\` ($AHEAD commit(s) ahead of \`$BASE\`) but no pull request is open. [Create PR]($GITHUB_SERVER_URL/$REPO/compare/$BASE...$BRANCH?quick_pull=1&$Q) · [run]($RUN_URL)" > /tmp/no-pr.md
          gh issue comment "$NUM" -R "$REPO" --body-file /tmp/no-pr.md || true
          exit 0
